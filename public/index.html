<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIS VTS Console — Selat Madura & Tanjung Perak</title>
  <meta name="description" content="Konsol monitoring pergerakan kapal AIS simulasi real-time di Selat Madura dan Pelabuhan Tanjung Perak Surabaya.">

  <!-- IBM Plex Sans (UI) + IBM Plex Mono (data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <link rel="stylesheet" href="css/console.css">
</head>
<body>

  <!-- ═══ TOPBAR ═══ -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/>
          <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
          <line x1="12" y1="3" x2="12" y2="7"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
          <line x1="3" y1="12" x2="7" y2="12"/>
          <line x1="17" y1="12" x2="21" y2="12"/>
        </svg>
      </div>
      <div>
        <div class="brand-title">AIS VTS CONSOLE</div>
        <div class="brand-sub">SELAT MADURA · TANJUNG PERAK</div>
      </div>
    </div>

    <div class="topbar-right">
      <button id="toggleMapTheme" class="btn" title="Ganti tema peta (gelap / terang)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <span id="mapThemeLabel">PETA GELAP</span>
      </button>

      <div class="stat">
        <span class="stat-label">Kapal Aktif</span>
        <span id="totalShips" class="stat-value accent">—</span>
      </div>
      <div class="stat update-stat">
        <span class="stat-label">Update</span>
        <span id="lastUpdated" class="stat-value">--:--:--</span>
      </div>
      <div class="stat utc-stat">
        <span class="stat-label">UTC</span>
        <span id="utcClock" class="stat-value">--:--:--</span>
      </div>

      <button id="paletteBtn" class="icon-btn" title="Ganti palet warna" aria-label="Ganti palet warna">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 3v18"/><path d="M12 12l6.5-6.5"/>
        </svg>
      </button>

      <div id="connBadge" class="conn-badge online">
        <span class="conn-dot"></span>
        <span id="connLabel">LIVE</span>
      </div>
    </div>
  </header>

  <!-- ═══ MAIN: PETA + SIDEBAR ═══ -->
  <main class="main">
    <div id="map" class="map-dark"></div>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-title">ARMADA AKTIF<b id="sidebarCount">0</b></span>
        <button id="toggleSidebar" class="icon-btn" title="Tutup sidebar" aria-label="Tutup sidebar">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </button>
      </div>

      <div class="filter-grid">
        <button data-filter="ferry" class="filter-btn active" aria-pressed="true"><span class="dot"></span>Ferry</button>
        <button data-filter="cargo" class="filter-btn active" aria-pressed="true"><span class="dot"></span>Cargo</button>
        <button data-filter="tanker" class="filter-btn active" aria-pressed="true"><span class="dot"></span>Tanker</button>
        <button data-filter="tug" class="filter-btn active" aria-pressed="true"><span class="dot"></span>Tug</button>
      </div>

      <div id="shipList" class="ship-list">
        <div id="loadingState" class="state-box">
          <div class="spinner"></div>
          <span>Menunggu data AIS...</span>
        </div>
      </div>
    </aside>

    <button id="openSidebarBtn" class="open-sidebar-btn" title="Buka sidebar" aria-label="Buka sidebar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <!-- ═══ PANEL RIWAYAT & PLAYBACK ═══ -->
    <section id="historyPanel" class="history-panel">
      <div class="history-head">
        <span class="history-title">RIWAYAT</span>
        <span id="historyShip" class="history-ship"></span>
        <span id="historyMmsi" class="history-mmsi"></span>
        <button id="historyClose" class="icon-btn" title="Tutup riwayat" aria-label="Tutup riwayat">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div id="historyBody">
        <div class="history-slider-row">
          <span id="historyTime" class="history-time">--:--:--</span>
          <div class="history-range">
            <input type="range" id="historySlider" min="0" max="0" value="0" step="1" aria-label="Posisi waktu riwayat">
            <div class="range-ends"><span id="historyStart">--:--:--</span><span id="historyEnd">--:--:--</span></div>
          </div>
          <span id="historyCount" class="history-count"></span>
        </div>
        <div class="history-controls">
          <button id="historyPlay" class="btn" title="Putar / jeda">
            <svg id="playIcon" width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <polygon points="6 3 20 12 6 21"/>
            </svg>
            <span id="playLabel">PLAY</span>
          </button>
          <button id="historySpeed" class="btn mono" title="Kecepatan playback">1×</button>
          <span id="historyReadout" class="history-readout"></span>
          <span id="historyHint" class="history-count history-hint">geser slider atau tekan play untuk memutar ulang track</span>
        </div>
      </div>
      <div id="historyMsg" class="history-msg" style="display:none"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <!-- Leaflet + Socket.io + app modules -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
